{% extends "base.html" %}
{% block title %}비밀번호 변경{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>비밀번호 변경</h1>
  {% if current_user.must_change_password %}<p class="flash flash-warn">처음 로그인했거나 관리자가 비밀번호를 초기화했습니다. 새 비밀번호를 설정하세요.</p>{% endif %}
  <form method="post" class="stack">
    {% include "_csrf.html" %}
    <label>현재 비밀번호 <input name="current" type="password" autocomplete="current-password" required></label>
    <label>새 비밀번호 ({{ min_len }}자 이상) <input name="new" type="password" autocomplete="new-password" minlength="{{ min_len }}" required></label>
    <label>새 비밀번호 확인 <input name="confirm" type="password" autocomplete="new-password" minlength="{{ min_len }}" required></label>
    <button type="submit" class="primary">변경</button>
  </form>
</section>
{% endblock %}
