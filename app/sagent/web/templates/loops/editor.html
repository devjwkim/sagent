{% extends "projects/_layout.html" %}
{% block scripts %}<script src="{{ url_for('static', filename='js/loop-editor.js') }}?v={{ app_version }}" defer></script>{% endblock %}
{% block project_content %}
<script type="application/json" id="loop-data">{{ payload|tojson }}</script>
<section class="card" id="loop-editor" data-save-url="{{ url_for('loops.loop_editor_save', slug=g.project.slug) }}">
  <div class="row-between">
    <h2>Loop 편집기</h2>
    <div class="row gap">
      <label class="check"><input type="checkbox" class="editor-default" {{ 'checked' if is_default }}> 기본 Loop</label>
      <span class="editor-status muted small"></span>
      <button type="button" class="primary editor-save">저장</button>
      <a class="button" href="{{ url_for('loops.loop_list', slug=g.project.slug) }}">닫기</a>
    </div>
  </div>
  <div class="editor-layout">
    <div class="graph-wrap editor-canvas-wrap"><svg class="loop-graph editor-canvas" role="application" aria-label="loop editor"></svg></div>
    <aside class="editor-panel"></aside>
  </div>
  <p class="muted small">저장하면 <code>.sagent/loops.yaml</code> 에 기록됩니다 (YAML 주석은 유지되지 않습니다). 저장 전에 서버가 그래프를 검증합니다.</p>
</section>
{% endblock %}
